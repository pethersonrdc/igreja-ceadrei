server {
    listen 80;
    listen [::]:80;
    server_name igrejaceasdrei.com.br www.igrejaceasdrei.com.br;

    # 120M barrava vídeos de ~3 min do celular. 1200M deixa o Flask
    # responder com mensagem amigável até 1024 MB.
    client_max_body_size 1200M;
    client_body_timeout 600s;

    # Arquivos estáticos direto do disco (mais rápido)
    location /static/ {
        alias /var/www/igreja-ceadrei/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
