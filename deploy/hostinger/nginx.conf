server {
    listen 80;
    listen [::]:80;
    server_name igrejaceasdrei.com.br www.igrejaceasdrei.com.br;

    client_max_body_size 120M;

    # Estáticos grandes: envia direto do kernel, sem recomprimir no Nginx
    sendfile on;
    tcp_nopush on;
    gzip off;

    # Headers de segurança (sempre, inclusive respostas de erro)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com" always;

    # SEO: arquivos estáticos (não passam pelo Gunicorn)
    location = /sitemap.xml {
        alias /var/www/igreja-ceadrei/seo/sitemap.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /robots.txt {
        alias /var/www/igreja-ceadrei/seo/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        alias /var/www/igreja-ceadrei/static/images/emblema.png;
        default_type image/png;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # Arquivos estáticos direto do disco (mais rápido)
    location /static/ {
        alias /var/www/igreja-ceadrei/static/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
