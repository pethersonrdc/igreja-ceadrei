server {
    listen 80;
    listen [::]:80;
    server_name igrejaceasdrei.com.br www.igrejaceasdrei.com.br;

    client_max_body_size 120M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # MP4 e demais estáticos saem do disco. Se /static/ cair no proxy do
    # Gunicorn (2 workers), cada Range do vídeo esgota o worker e o Nginx
    # devolve 503. No VPS atual o app está em /opt/igreja-ceadrei — o
    # setup.sh troca o alias abaixo pelo APP_DIR.
    location /static/ {
        alias /var/www/igreja-ceadrei/static/;
        expires 7d;
        add_header Cache-Control "public";
        sendfile on;
        tcp_nopush on;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
