services:
  - type: web
    name: igreja-ceadrei
    runtime: python
    # Starter é necessário para Persistent Disk (plano free apaga posts no redeploy)
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600
    healthCheckPath: /
    disk:
      name: igreja-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
