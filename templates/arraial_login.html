{% extends "base.html" %}

{% block body_class %}tema-arraial{% endblock %}

{% block title %}Arraiá Gospel — Acesso{% endblock %}

{% block content %}
<section class="page-hero arraial-hero">
  <p class="eyebrow">Departamento · Cantina</p>
  <h1>{{ h1_responsavel }}</h1>
  <p>Acesso dos Lideres — Arraiá Gospel / Cantina.</p>
</section>

<section class="section arraial-login-layout">
  <div class="campanha-login-stage campanha-login-stage--arraial">
    <div class="login-anim login-anim--arraial" aria-hidden="true">
      <span class="login-anim-bandeira login-anim-bandeira--1"></span>
      <span class="login-anim-bandeira login-anim-bandeira--2"></span>
      <span class="login-anim-bandeira login-anim-bandeira--3"></span>
      <span class="login-anim-balao login-anim-balao--1"></span>
      <span class="login-anim-balao login-anim-balao--2"></span>
    </div>
    <form class="admin-card arraial-card campanha-login-card campanha-login-card--anim" method="post" action="{{ url_for('arraial_login', next=request.args.get('next', '')) }}">
      <label for="senha">Senha de acesso</label>
      <input id="senha" name="senha" type="password" required autofocus placeholder="Digite a senha">
      {% if erro %}
      <p class="admin-msg admin-msg--erro">{{ erro }}</p>
      {% endif %}
      <button class="btn btn-primary btn-arraial" type="submit">Entrar</button>
    </form>
  </div>

  <figure class="arraial-lider-foto">
    <img src="{{ url_for('static', filename=info.foto_lider) }}" alt="Diac. Cássia">
    <figcaption>Diac. Cássia</figcaption>
  </figure>
</section>
{% endblock %}
